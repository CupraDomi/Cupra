{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="card" style="max-width:520px;margin:2rem auto;text-align:center">
  <div class="card-body" style="padding:2.5rem 1.5rem">
    <div style="font-size:3rem;color:var(--brand-orange);font-weight:700;margin-bottom:.5rem">
      {{ code }}
    </div>
    <h2 style="margin:0 0 .75rem;color:var(--brand-navy)">{{ title }}</h2>
    <p style="color:var(--grey-500);margin-bottom:1.5rem">{{ message }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Volver al inicio</a>
  </div>
</div>
{% endblock %}
