<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enlace expirado</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .card {
      background: #fff; border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
      padding: 2.5rem 2rem; text-align: center; max-width: 420px; width: 100%;
    }
    .icon { font-size: 4rem; color: #e07800; margin-bottom: 1rem; }
    h1 { font-size: 1.3rem; color: #1e3a5f; margin-bottom: .5rem; }
    p  { color: #666; font-size: .9rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⏱</div>
    <h1>Enlace expirado o inválido</h1>
    <p>Este enlace de firma ya no es válido.<br>
       Pide al trabajador que genere uno nuevo desde la aplicación.</p>
  </div>
</body>
</html>
