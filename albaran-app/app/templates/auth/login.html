<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Maquinaria</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .auth-card {
      background:#fff; border-radius:10px; box-shadow:0 4px 24px rgba(0,30,87,.10);
      padding:2.5rem 2rem; width:100%; max-width:380px;
    }
    .auth-logo { text-align:center; margin-bottom:1.5rem; }
    .auth-logo img { max-width:150px; }
    .auth-logo small { display:block; color:var(--text-muted); margin-top:.25rem; }
    .auth-card h2 { text-align:center; color:var(--brand-navy); margin-bottom:1.5rem; font-size:1.2rem; }
    .form-check { display:flex; align-items:center; gap:.5rem; margin-top:.25rem; }
    .form-check input { width:auto; margin:0; }
    .form-check label { margin:0; font-weight:400; }
    .btn-block { width:100%; margin-top:1rem; }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <img src="{{ url_for('static', filename='img/sim_logo.png') }}" alt="SIM">
    <small>Gestión de Albaranes</small>
  </div>
  <h2>Iniciar sesión</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div style="margin-bottom:1rem">
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }}" style="margin-bottom:.5rem">{{ msg }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" class="form-control"
             required autofocus autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" class="form-control"
             required autocomplete="current-password">
    </div>
    <div class="form-check">
      <input type="checkbox" id="remember" name="remember" value="1">
      <label for="remember">Recordarme</label>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
  </form>
</div>
</body>
</html>
